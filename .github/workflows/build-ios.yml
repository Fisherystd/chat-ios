name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify web assets
        run: |
          test -f www/index.html || { echo "::error::www/index.html missing"; exit 1; }

      - name: Rebuild iOS platform
        run: |
          set -x
          rm -rf ios
          npx cap add ios
          cp AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          npx cap sync ios
          ls -la ios/App
          if [ ! -f ios/App/Podfile ]; then echo "::error::Podfile missing"; exit 1; fi

      - name: Pod install
        run: |
          set -x
          cd ios/App
          command -v pod >/dev/null 2>&1 || sudo gem install cocoapods --no-document
          pod install --repo-update
          ls -la App.xcworkspace

      - name: Build unsigned
        run: |
          set -o pipefail
          cd ios/App
          mkdir -p build
          LOG=build/xcodebuild.log
          if xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
               -derivedDataPath build build \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
               > "$LOG" 2>&1; then
            echo "xcodebuild OK"
          else
            echo "xcodebuild FAILED - last 200 lines:"
            tail -n 200 "$LOG"
            exit 1
          fi
          tail -n 20 "$LOG"

      - name: Package IPA
        run: |
          set -e
          cd ios/App
          APP=build/Build/Products/Release-iphoneos/App.app
          if [ ! -d "$APP" ]; then
            echo "App.app not found; listing products:"
            find build -name '*.app' -maxdepth 6 || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr App-unsigned.ipa Payload
          ls -lh App-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: ios/App/build/App-unsigned.ipa
          if-no-files-found: error
