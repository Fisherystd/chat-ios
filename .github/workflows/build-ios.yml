name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify web assets
        run: |
          if [ ! -f www/index.html ]; then
            echo "::error::www/index.html 不存在，请重新上传 www 目录"; exit 1
          fi

      - name: Rebuild iOS platform (fresh)
        run: |
          set -x
          rm -rf ios
          npx cap add ios
          if [ -f AppIcon-1024.png ]; then
            cp AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          fi
          npx cap sync ios

      - name: Pod install
        run: |
          set -x
          cd ios/App
          if [ -f Podfile ]; then
            command -v pod >/dev/null 2>&1 || sudo gem install cocoapods --no-document
            pod install --repo-update
          fi

      - name: Build (unsigned, exposes real error)
        run: |
          set -o pipefail
          cd ios/App
          mkdir -p build
          LOG=build/xcodebuild.log
          if [ -f App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          set +e
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            > $LOG 2>&1
          RC=$?
          set -e
          echo "xcodebuild exit code: $RC"
          tail -n 150 $LOG
          if [ $RC -ne 0 ]; then exit $RC; fi

      - name: Package IPA
        run: |
          set -e
          cd ios/App
          APP=build/Build/Products/Release-iphoneos/App.app
          if [ ! -d "$APP" ]; then
            echo "未找到 App.app，列出产物："
            find build/Build -maxdepth 4 -name '*.app' || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr App-unsigned.ipa Payload
          ls -lh App-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: ios/App/build/App-unsigned.ipa
          if-no-files-found: error
